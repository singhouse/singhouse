# Development convenience ONLY — for `alembic revision --autogenerate` by hand.
# Nothing at runtime reads this file: db/migrate.py builds the Config
# programmatically (script_location from the package, URL via attributes), so
# the app and CLI never depend on the cwd or on this ini existing.
[alembic]
script_location = src/karaoke_backend/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
