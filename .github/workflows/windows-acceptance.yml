name: Windows acceptance builds

# These artifacts are private-test inputs, not a public release or qualification.
# Recipe hashes are reviewed and committed before a separate application build.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'desktop/build/windows_acceptance.py'
permissions:
  contents: read
concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recipes:
    name: Windows ${{ matrix.accelerator }} recipe
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        accelerator: [cpu, cuda]
    steps:
      - uses: actions/checkout@v7
        with:
          # A recipe records the reviewed commit, never an ephemeral merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build exact native dependency inventory
        run: >-
          python desktop/build/windows_acceptance.py recipe
          --work "${{ runner.temp }}/acceptance-${{ matrix.accelerator }}"
          --accelerator "${{ matrix.accelerator }}"
          --artifact-base-url "https://github.com/singhouse/processing-packs/releases/download/windows-acceptance-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.accelerator }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-recipe-${{ matrix.accelerator }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/acceptance-${{ matrix.accelerator }}/build/recipe/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
