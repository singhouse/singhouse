# SPDX-License-Identifier: AGPL-3.0-only
name: Windows signing access preflight

on:
  workflow_dispatch:
    inputs:
      account:
        description: Artifact Signing account name
        required: true
        type: string
      profile:
        description: Public Trust certificate profile name
        required: true
        type: string
      resource_group:
        description: Resource group (optional; omit only to discover via subscription resource listing)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Check OIDC and read signing metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: windows-signing
    timeout-minutes: 10
    env:
      AZURE_CORE_OUTPUT: none
      SIGNING_ACCOUNT: ${{ inputs.account }}
      SIGNING_PROFILE: ${{ inputs.profile }}
      SIGNING_RESOURCE_GROUP: ${{ inputs.resource_group }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Validate requested resource names
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGNING_ACCOUNT" =~ ^[a-z0-9][a-z0-9-]{1,22}[a-z0-9]$ ]] || { echo '::error::Invalid account name'; exit 1; }
          [[ "$SIGNING_PROFILE" =~ ^[A-Za-z0-9][A-Za-z0-9-]{1,98}[A-Za-z0-9]$ ]] || { echo '::error::Invalid profile name'; exit 1; }
          if [[ -n "$SIGNING_RESOURCE_GROUP" ]]; then
            [[ "$SIGNING_RESOURCE_GROUP" =~ ^[A-Za-z0-9_.()-]{1,90}$ && "$SIGNING_RESOURCE_GROUP" != *. ]] || { echo '::error::Invalid resource group name'; exit 1; }
          fi
          echo 'This preflight reads Azure metadata only. Signing, builds, publication, and changes to Azure permissions are not performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate to Azure with GitHub OIDC
        id: login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read Central US account and Public Trust profile
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo 'GitHub OIDC login: succeeded.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$SIGNING_RESOURCE_GROUP" ]]; then
            account_id="/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$SIGNING_RESOURCE_GROUP/providers/Microsoft.CodeSigning/codeSigningAccounts/$SIGNING_ACCOUNT"
          else
            echo '::notice::Resource group omitted: discovery requires subscription resource-list access. Discovery failure does not establish that signing permission is missing.'
            accounts=$(az resource list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-type Microsoft.CodeSigning/codeSigningAccounts --name "$SIGNING_ACCOUNT" --output json --only-show-errors)
            [[ $(jq 'length' <<< "$accounts") == 1 ]] || { echo '::error::Expected exactly one account. Supply its resource group to avoid subscription-wide discovery.'; exit 1; }
            account_id=$(jq -er '.[0].id' <<< "$accounts")
          fi
          account=$(az resource show --ids "$account_id" --output json --only-show-errors)
          jq -e --arg name "$SIGNING_ACCOUNT" --arg id "$account_id" '
            (.id | ascii_downcase) == ($id | ascii_downcase) and
            .name == $name and
            (.type | ascii_downcase) == "microsoft.codesigning/codesigningaccounts" and
            (.location | ascii_downcase | gsub(" "; "")) == "centralus"
          ' <<< "$account" > /dev/null || { echo '::error::Account identity or Central US location mismatch'; exit 1; }
          profile_id="$account_id/certificateProfiles/$SIGNING_PROFILE"
          profile=$(az resource show --ids "$profile_id" --output json --only-show-errors)
          jq -e --arg id "$profile_id" '
            (.id | ascii_downcase) == ($id | ascii_downcase) and
            (.type | ascii_downcase) == "microsoft.codesigning/codesigningaccounts/certificateprofiles" and
            .properties.profileType == "PublicTrust"
          ' <<< "$profile" > /dev/null || { echo '::error::Exact certificate profile was not verified as PublicTrust'; exit 1; }
          printf 'PROFILE_RESOURCE_ID=%s\n' "$profile_id" >> "$GITHUB_ENV"
          echo 'Account metadata: verified Central US. Exact certificate profile: verified PublicTrust.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Regional signing endpoint for this location: https://cus.codesigning.azure.net (data-plane access untested).' >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect visible role assignments (best effort)
        shell: bash
        run: |
          set -euo pipefail
          # AZURE_CLIENT_ID is an application/client ID, not a principal object ID.
          # Resolving it can require directory read permission; do not turn that
          # failure into a claim about the principal's signing authorization.
          if roles=$(az role assignment list --assignee "$AZURE_CLIENT_ID" --scope "$PROFILE_RESOURCE_ID" --include-inherited --fill-principal-name false --output json --only-show-errors 2> "$RUNNER_TEMP/role-lookup-error.txt"); then
            count=$(jq 'length' <<< "$roles")
            echo "Visible direct/inherited role assignments: $count. This is not a complete effective-permissions evaluation." >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "Role: " + (.roleDefinitionName // "unresolved role definition") + (if .condition then " (conditional assignment)" else "" end)' <<< "$roles" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Role inspection unavailable: directory client-ID resolution or role-assignment read access may be unavailable. This does not establish whether signing is allowed.'
            echo 'Role assignments: inspection unavailable; signing authorization remains untested.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record the limits of this result
        if: always()
        env:
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        shell: bash
        run: |
          printf '\nOIDC login step: %s. Metadata step: %s.\n' "$LOGIN_OUTCOME" "$METADATA_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual signing ability and regional data-plane access were NOT tested. A metadata or role-inspection failure does not prove that the Certificate Profile Signer role is missing. No artifact was signed, built, or published.' >> "$GITHUB_STEP_SUMMARY"
