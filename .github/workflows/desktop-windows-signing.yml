name: Private Windows signing candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign-windows:
    name: Build and verify signed Windows candidate
    runs-on: windows-latest
    environment: windows-signing
    timeout-minutes: 120
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; verified 2026-09-10
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Require the exact Public Trust certificate profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $accounts = @(az resource list --subscription $env:AZURE_SUBSCRIPTION_ID --resource-type Microsoft.CodeSigning/codeSigningAccounts --name singhouse-signing --output json --only-show-errors | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $accounts.Count -ne 1) {
            throw "Expected exactly one Artifact Signing account named singhouse-signing; found $($accounts.Count)."
          }
          $accountLocation = ([string]$accounts[0].location -replace '\s', '').ToLowerInvariant()
          if ($accounts[0].type -ne 'Microsoft.CodeSigning/codeSigningAccounts' -or
              $accounts[0].name -ne 'singhouse-signing' -or $accountLocation -ne 'centralus') {
            throw 'Artifact Signing account type, name, or location does not match the approved Central US account.'
          }
          $profileResourceId = "$($accounts[0].id)/certificateProfiles/singhouse"
          $profile = az resource show --ids $profileResourceId --output json --only-show-errors | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              -not ([string]$profile.id).Equals($profileResourceId, [StringComparison]::OrdinalIgnoreCase) -or
              $profile.type -ne 'Microsoft.CodeSigning/codeSigningAccounts/certificateProfiles' -or
              $profile.properties.profileType -ne 'PublicTrust') {
            throw "Artifact Signing profile is not verified as PublicTrust (reported: $($profile.properties.profileType))."
          }
      - name: Install locked build tools and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uvWheel = Join-Path $env:RUNNER_TEMP 'uv-0.12.8-py3-none-win_amd64.whl'
          Invoke-WebRequest -Uri 'https://files.pythonhosted.org/packages/d6/f2/3564ae1d1d37b66dc64e6be52f5e5fe00cfce235b6f60d0b708c6caf7588/uv-0.12.8-py3-none-win_amd64.whl' -OutFile $uvWheel
          $uvHash = (Get-FileHash -LiteralPath $uvWheel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($uvHash -ne '53984d68cddd227e6433b70b510d4b47fe82e658f22f4a6ca416b4e373406393') { throw 'uv wheel SHA-256 mismatch' }
          py -3.12 -m pip install --no-deps $uvWheel
          if ((uv --version) -ne 'uv 0.12.8') { throw 'Unexpected uv version' }
          npm --prefix desktop ci
      - name: Assemble signed Windows application and first installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 desktop/build/assemble.py --target win32-x64 --output desktop/native
          npm --prefix desktop run package:first-installers -- --signed-release --azure-oidc
      - name: Verify signatures and write final SHA-256 inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem desktop/artifacts -File -Filter 'Singhouse-*-win-x64.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $paths = @('desktop/artifacts/win-unpacked/Singhouse.exe', $installers[0].FullName)
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -ne 'CN=Bones Consulting LLC, O=Bones Consulting LLC, L=Overland Park, S=Kansas, C=US' -or
                -not $signature.TimeStamperCertificate) { throw "Invalid signed artifact: $path" }
          }
          Get-ChildItem desktop/artifacts -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path desktop/artifacts), $_.FullName).Replace('\', '/')
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLowerInvariant())  $relative"
          } | Set-Content -Encoding ascii desktop/artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singhouse-windows-signed-${{ github.sha }}
          path: desktop/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
