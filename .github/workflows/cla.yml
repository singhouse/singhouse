name: CLA
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  cla:
    name: Verify CLA coverage
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      # Execute only the immutable BASE revision, never a contributor's code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; verified 2026-09-10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1; verified 2026-09-10
        with:
          script: |
            const { run } = require('./.github/scripts/cla.cjs');
            const sha = context.payload.pull_request.head.sha;
            const status = (state, description) => github.rest.repos.createCommitStatus({
              ...context.repo, sha, state, context: 'CLA signed', description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await status('pending', 'Verifying contribution coverage');
            try {
              await run({ github, context, core });
              await status('success', 'CLA coverage verified; owner merge review still required');
            } catch (error) {
              await status('failure', 'CLA verification failed; see workflow log');
              core.setFailed(error.message);
            }
